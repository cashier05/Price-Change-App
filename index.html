<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Price Change LMI-05</title>
    <meta name="description" content="Aplikasi Price Change LMI-05">

    <!-- ============ PWA (Android / Chrome / Edge) ============ -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#075E54">
    <meta name="application-name" content="Price Change">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- ============ iOS / iPhone (Add to Home Screen) ============ -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Price Change">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <!-- ============ Favicon ============ -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

    <style>
        :root { --brand: #075E54; --brand-soft: #e7f2f0; }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
        }

        /* Bingkai aplikasi. Padding safe-area hanya aktif saat mode ter-install
           (standalone) di iPhone ber-notche, agar konten tidak tertutup status bar. */
        #frame-wrap {
            position: fixed; inset: 0; background: var(--brand);
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        #app { display: block; width: 100%; height: 100%; border: 0; background: #fff; }

        /* Layar loading */
        #loader {
            position: fixed; inset: 0; z-index: 30; background: #fff;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; transition: opacity .45s ease;
        }
        #loader.done { opacity: 0; pointer-events: none; }
        .spinner {
            width: 46px; height: 46px; border-radius: 50%;
            border: 4px solid #dcebe9; border-top-color: var(--brand);
            animation: spin 1s linear infinite; margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loader .txt { font-size: 14.5px; color: #333; font-weight: 600; }
        #loader .sub { font-size: 12.5px; color: #8a8a8a; }

        /* Pemberitahuan kalau aplikasi lambat dimuat */
        #slowBar {
            position: fixed; top: calc(env(safe-area-inset-top) + 10px);
            left: 50%; transform: translateX(-50%); z-index: 25;
            background: #fff8e1; border: 1px solid #f0dd9a; color: #6b5b1e;
            font-size: 13px; padding: 9px 14px; border-radius: 12px;
            white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.08);
        }
        #slowBar a { color: #0b6b4f; font-weight: 700; text-decoration: none; }

        /* Tombol Install mengambang */
        .fab {
            position: fixed; left: 50%; transform: translateX(-50%);
            bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 40;
            display: flex; align-items: center; gap: 9px;
            background: var(--brand); color: #fff; border: 0;
            padding: 14px 24px; border-radius: 999px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 22px rgba(7,94,84,.38);
        }
        .fab:active { transform: translateX(-50%) scale(.96); }

        /* Panel panduan install (bottom sheet) */
        .overlay {
            position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45);
            display: flex; align-items: flex-end; justify-content: center;
        }
        .sheet {
            width: 100%; max-width: 430px; background: #fff;
            border-radius: 20px 20px 0 0;
            padding: 14px 22px calc(22px + env(safe-area-inset-bottom));
            animation: up .28s ease;
        }
        @keyframes up { from { transform: translateY(46px); opacity: .35; } to { transform: none; opacity: 1; } }
        .handle { width: 44px; height: 5px; border-radius: 99px; background: #d8d8d8; margin: 0 auto 14px; }
        .sheet h2 { margin: 0 0 2px; font-size: 19px; color: #111; }
        .sheet .sub { margin: 0 0 14px; font-size: 13.5px; color: #777; }
        .vicon {
            width: 66px; height: 66px; border-radius: 16px; background: var(--brand-soft);
            display: flex; align-items: center; justify-content: center; margin: 2px auto 14px;
        }
        .steps { list-style: none; margin: 0 0 12px; padding: 0; counter-reset: st; }
        .steps li {
            counter-increment: st; display: flex; gap: 11px; margin: 11px 0;
            font-size: 14.5px; line-height: 1.5; color: #222; align-items: flex-start;
        }
        .steps li::before {
            content: counter(st); flex: 0 0 24px; height: 24px; border-radius: 50%;
            background: var(--brand); color: #fff; font-weight: 700; font-size: 13px;
            display: flex; align-items: center; justify-content: center; margin-top: 1px;
        }
        .steps li span { flex: 1; }
        .note {
            margin: 0 0 16px; font-size: 12.5px; line-height: 1.55; color: #6d7a78;
            background: #f3f8f7; border-radius: 12px; padding: 11px 13px;
        }
        .btn-primary {
            width: 100%; background: var(--brand); border: 0; color: #fff;
            font-size: 16px; font-weight: 700; padding: 14px; border-radius: 13px; cursor: pointer;
        }
        .btn-primary:active { opacity: .9; }

        .toast {
            position: fixed; left: 50%; transform: translateX(-50%);
            bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 60;
            background: #1c1c1c; color: #fff; font-size: 14px; padding: 11px 18px;
            border-radius: 12px; opacity: 0; transition: opacity .3s;
            pointer-events: none; max-width: 86vw; text-align: center;
        }
        .toast.show { opacity: .96; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="frame-wrap">
        <iframe id="app"
            src="https://script.google.com/macros/s/AKfycbwVp9Ee3CL6OfFRUNfYogOj5NdIaHGUj59VobmT068qsGvYHmUvko-PCHZduD-KMXQU/exec"
            allow="fullscreen; camera; microphone; display-capture; geolocation">
        </iframe>
    </div>

    <!-- Layar loading -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="txt">Memuat aplikasi&hellip;</div>
        <div class="sub">Price Change LMI-05</div>
    </div>

    <!-- Muncul hanya jika aplikasi lambat dimuat -->
    <div id="slowBar" class="hidden">
        Aplikasi lambat dimuat? <a id="openTab" href="#" target="_blank" rel="noopener">Buka di tab baru</a>
    </div>

    <!-- Tombol install (muncul otomatis di Android & iPhone) -->
    <button id="installFab" class="fab hidden">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 19h16"/>
        </svg>
        <span>Install Aplikasi</span>
    </button>

    <!-- Panel panduan install -->
    <div id="guide" class="overlay hidden">
        <div class="sheet">
            <div class="handle"></div>
            <h2 id="gTitle"></h2>
            <p class="sub" id="gSub"></p>
            <div id="gVisual"></div>
            <ol class="steps" id="gSteps"></ol>
            <p class="note" id="gNote"></p>
            <button id="gClose" class="btn-primary">Mengerti</button>
        </div>
    </div>

    <div id="toast" class="toast">Aplikasi berhasil dipasang</div>

    <script>
    (function () {
        'use strict';

        var frame   = document.getElementById('app');
        var loader  = document.getElementById('loader');
        var slowBar = document.getElementById('slowBar');
        var fab     = document.getElementById('installFab');
        var guide   = document.getElementById('guide');
        var gTitle  = document.getElementById('gTitle');
        var gSub    = document.getElementById('gSub');
        var gVisual = document.getElementById('gVisual');
        var gSteps  = document.getElementById('gSteps');
        var gNote   = document.getElementById('gNote');
        var gClose  = document.getElementById('gClose');
        var toast   = document.getElementById('toast');
        var openTab = document.getElementById('openTab');

        try { openTab.href = frame.getAttribute('src'); } catch (e) {}

        var params    = new URLSearchParams(location.search);
        var debugMode = (params.get('debug') || '').toLowerCase(); // ?debug=ios / ?debug=android

        var ua   = navigator.userAgent || '';
        var isIOS = /iphone|ipad|ipod/i.test(ua) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS menyamar jadi Mac
        var effIOS = isIOS || debugMode === 'ios';

        var isStandalone =
            (window.matchMedia && (window.matchMedia('(display-mode: standalone)').matches ||
                                   window.matchMedia('(display-mode: minimal-ui)').matches)) ||
            window.navigator.standalone === true;
        var effStandalone = isStandalone && !debugMode;

        var deferredPrompt = null;
        var toastTimer = null;

        function show(el) { el.classList.remove('hidden'); }
        function hide(el) { el.classList.add('hidden'); }

        /* ---------- Layar loading & pemberitahuan lambat ---------- */
        var iframeLoaded = false;
        frame.addEventListener('load', function () {
            iframeLoaded = true;
            loader.classList.add('done');
            hide(slowBar);
        });
        window.addEventListener('load', function () {
            setTimeout(function () { loader.classList.add('done'); }, 3000); // pengaman
        });
        setTimeout(function () { loader.classList.add('done'); }, 20000);    // pengaman terakhir
        setTimeout(function () { if (!iframeLoaded) show(slowBar); }, 15000);

        /* ---------- Data panduan install ---------- */
        var ICON_SHARE = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#075E54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m8 7 4-4 4 4"/><path d="M6 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1"/></svg>';
        var ICON_DOTS  = '<svg width="34" height="34" viewBox="0 0 24 24" fill="#075E54"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>';

        var GUIDE = {
            ios: {
                title: 'Pasang di iPhone / iPad',
                sub: '3 langkah cepat di Safari',
                visual: ICON_SHARE,
                steps: [
                    'Tap tombol <b>Bagikan</b> (kotak dengan panah ke atas) di bagian bawah layar Safari.',
                    'Gulir ke bawah, lalu tap <b>&ldquo;Tambahkan ke Layar Utama&rdquo;</b>.',
                    'Tap <b>&ldquo;Tambah&rdquo;</b> di pojok kanan atas.'
                ],
                note: 'Catatan: Apple tidak mengizinkan dialog install otomatis seperti di Android, jadi pemasangan di iPhone memang dilakukan lewat tombol Bagikan. Setelah ikon &ldquo;Price Change&rdquo; muncul di Layar Utama, buka aplikasi dari sana &mdash; tampil penuh tanpa address bar.'
            },
            android: {
                title: 'Pasang di Android',
                sub: 'Kalau dialog install belum muncul otomatis',
                visual: ICON_DOTS,
                steps: [
                    'Buka menu Chrome (ikon <b>&sdot;&sdot;&sdot;</b> tiga titik di pojok kanan atas).',
                    'Pilih <b>&ldquo;Tambahkan ke layar utama&rdquo;</b> atau <b>&ldquo;Install aplikasi&rdquo;</b>.',
                    'Konfirmasi dengan men-tap <b>&ldquo;Install&rdquo;</b>.'
                ],
                note: 'Tombol hijau &ldquo;Install Aplikasi&rdquo; akan otomatis memunculkan dialog resmi Chrome begitu perangkat memenuhi syarat (HTTPS, manifest, dan service worker sudah disiapkan di halaman ini).'
            }
        };

        function openGuide(key) {
            var g = GUIDE[key];
            if (!g) return;
            gTitle.textContent = g.title;
            gSub.textContent = g.sub;
            gVisual.innerHTML = '<div class="vicon">' + g.visual + '</div>';
            gSteps.innerHTML = g.steps.map(function (s) { return '<li><span>' + s + '</span></li>'; }).join('');
            gNote.innerHTML = g.note;
            show(guide);
        }
        function closeGuide() { hide(guide); }

        gClose.addEventListener('click', closeGuide);
        guide.addEventListener('click', function (e) { if (e.target === guide) closeGuide(); });

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2600);
        }

        /* ---------- Tombol Install ---------- */
        function showFab() { if (!effStandalone) show(fab); }

        fab.addEventListener('click', function () {
            if (effIOS) { openGuide('ios'); return; }
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(function (choice) {
                    if (choice && choice.outcome === 'accepted') {
                        hide(fab);
                        showToast('Aplikasi berhasil dipasang');
                    }
                    deferredPrompt = null;
                }).catch(function () { deferredPrompt = null; });
            } else {
                openGuide('android');
            }
        });

        window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            deferredPrompt = e;
            showFab();
        });

        window.addEventListener('appinstalled', function () {
            hide(fab);
            closeGuide();
            showToast('Aplikasi berhasil dipasang');
        });

        if (window.matchMedia) {
            var mq = window.matchMedia('(display-mode: standalone)');
            var onMode = function (ev) { if (ev.matches) { hide(fab); closeGuide(); } };
            if (mq.addEventListener) { mq.addEventListener('change', onMode); }
            else if (mq.addListener) { mq.addListener(onMode); }
        }

        /* ---------- Kapan UI install ditampilkan ---------- */
        if (effStandalone) {
            /* Sudah berjalan sebagai aplikasi terpasang: UI install disembunyikan */
        } else if (debugMode === 'ios' || debugMode === 'android') {
            openGuide(debugMode);
            setTimeout(showFab, 800);
        } else if (isIOS) {
            setTimeout(showFab, 1500);
            var hinted = false;
            try { hinted = sessionStorage.getItem('pc_ios_hint') === '1'; } catch (e) {}
            if (!hinted) {
                try { sessionStorage.setItem('pc_ios_hint', '1'); } catch (e) {}
                setTimeout(function () { openGuide('ios'); }, 1100); // panduan muncul otomatis sekali
            }
        } else {
            setTimeout(showFab, 5000); // Android: dialog resmi lewat beforeinstallprompt, ini cadangannya
        }

        /* ---------- Service worker (syarat install di Android/Chrome) ---------- */
        if ('serviceWorker' in navigator &&
            (location.protocol === 'https:' || location.hostname === 'localhost')) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .catch(function (err) { console.warn('Service worker gagal didaftarkan:', err); });
            });
        }
    })();
    </script>
</body>
</html>
